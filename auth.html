<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/png" href="https://github.com/user-attachments/assets/aa05c2ec-a168-4973-bfe5-03b7bd4138a2"/>
  <title>The Architect — Access Terminal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --cyan: #00f2ff;
      --cyan-dim: rgba(0,242,255,0.08);
      --cyan-glow: rgba(0,242,255,0.25);
      --bg: #080b10;
      --surface: #0d1117;
      --border: rgba(0,242,255,0.15);
      --border-bright: rgba(0,242,255,0.45);
      --text: #c9d1d9;
      --text-dim: #58a6a6;
      --error: #ff4d6d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      font-family: 'IBM Plex Mono', monospace;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Animated grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,242,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,242,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      animation: gridDrift 20s linear infinite;
    }
    @keyframes gridDrift {
      0% { transform: translateY(0); }
      100% { transform: translateY(40px); }
    }

    /* Corner scan line */
    body::after {
      content: '';
      position: fixed;
      top: -100%;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--cyan), transparent);
      animation: scanline 6s linear infinite;
      pointer-events: none;
      opacity: 0.4;
    }
    @keyframes scanline {
      0% { top: -2px; }
      100% { top: 100%; }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 2px;
      width: 100%;
      max-width: 460px;
      padding: 0;
      position: relative;
      box-shadow: 0 0 60px rgba(0,242,255,0.05), 0 0 0 1px rgba(0,242,255,0.08);
      animation: fadeUp 0.5s ease forwards;
      opacity: 0;
      transform: translateY(16px);
    }
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* Top accent bar */
    .card-top-bar {
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--cyan), transparent);
      border-radius: 2px 2px 0 0;
    }

    .card-header {
      padding: 28px 32px 20px;
      border-bottom: 1px solid var(--border);
    }
    .brand-line {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }
    .brand-dot {
      width: 8px; height: 8px;
      background: var(--cyan);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--cyan);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .brand-name {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: 0.08em;
      color: #fff;
      text-transform: uppercase;
    }
    .system-label {
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 0.15em;
      margin-top: 2px;
    }

    /* Tab switcher */
    .tabs {
      display: flex;
      padding: 20px 32px 0;
      gap: 0;
      border-bottom: 1px solid var(--border);
    }
    .tab {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-dim);
      padding: 10px 20px;
      cursor: pointer;
      border: 1px solid transparent;
      border-bottom: none;
      border-radius: 2px 2px 0 0;
      transition: all 0.2s;
      position: relative;
      bottom: -1px;
      background: transparent;
    }
    .tab.active {
      color: var(--cyan);
      border-color: var(--border);
      background: var(--bg);
      border-bottom-color: var(--bg);
    }
    .tab:not(.active):hover {
      color: var(--text);
    }

    .form-body {
      padding: 28px 32px 32px;
    }

    /* Avatar upload */
    .avatar-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }
    .avatar-preview {
      width: 56px; height: 56px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: #0d1a1a;
      overflow: hidden;
      flex-shrink: 0;
      position: relative;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .avatar-preview:hover { border-color: var(--cyan); }
    .avatar-preview img {
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .avatar-placeholder {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      color: var(--text-dim);
    }
    .avatar-preview input[type="file"] {
      position: absolute; inset: 0;
      opacity: 0; cursor: pointer;
    }
    .avatar-hint {
      font-size: 11px;
      color: var(--text-dim);
      line-height: 1.5;
    }
    .avatar-hint strong { color: var(--text); display: block; margin-bottom: 2px; }

    /* Form fields */
    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 7px;
    }
    .field input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 11px 14px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .field input:focus {
      border-color: var(--border-bright);
      box-shadow: 0 0 0 3px var(--cyan-dim);
    }
    .field input::placeholder { color: rgba(88,166,166,0.4); }

    /* Buttons */
    .btn-primary {
      width: 100%;
      margin-top: 6px;
      padding: 13px;
      background: transparent;
      border: 1px solid var(--cyan);
      border-radius: 2px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--cyan);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.2s;
    }
    .btn-primary::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--cyan);
      transform: translateX(-101%);
      transition: transform 0.25s ease;
      z-index: 0;
    }
    .btn-primary:hover::before { transform: translateX(0); }
    .btn-primary:hover { color: #080b10; }
    .btn-primary span { position: relative; z-index: 1; }
    .btn-primary:disabled {
      opacity: 0.5; cursor: not-allowed;
    }
    .btn-primary:disabled::before { display: none; }

    /* Error / success */
    .msg {
      font-size: 11px;
      letter-spacing: 0.05em;
      padding: 10px 14px;
      border-radius: 2px;
      margin-bottom: 16px;
      display: none;
    }
    .msg.error { background: rgba(255,77,109,0.08); border: 1px solid rgba(255,77,109,0.3); color: #ff4d6d; }
    .msg.success { background: rgba(0,242,255,0.06); border: 1px solid var(--border); color: var(--cyan); }
    .msg.show { display: block; }

    /* Loading spinner inline */
    .spinner {
      display: inline-block;
      width: 12px; height: 12px;
      border: 2px solid rgba(0,242,255,0.3);
      border-top-color: var(--cyan);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Decorative corner brackets */
    .corner { position: absolute; width: 12px; height: 12px; }
    .corner-tl { top: -1px; left: -1px; border-top: 2px solid var(--cyan); border-left: 2px solid var(--cyan); }
    .corner-tr { top: -1px; right: -1px; border-top: 2px solid var(--cyan); border-right: 2px solid var(--cyan); }
    .corner-bl { bottom: -1px; left: -1px; border-bottom: 2px solid var(--cyan); border-left: 2px solid var(--cyan); }
    .corner-br { bottom: -1px; right: -1px; border-bottom: 2px solid var(--cyan); border-right: 2px solid var(--cyan); }
  </style>
</head>
<body>

  <div class="card" style="margin: 20px;">
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <div class="card-top-bar"></div>

    <div class="card-header">
      <div class="brand-line">
        <div class="brand-dot"></div>
        <span class="brand-name">The Architect</span>
      </div>
      <div class="system-label">// COLD EMAIL DISPATCH SYSTEM v2.0</div>
    </div>

    <div class="tabs">
      <button class="tab active" id="tabLogin" onclick="switchTab('login')">Login</button>
      <button class="tab" id="tabSignup" onclick="switchTab('signup')">Create Account</button>
    </div>

    <div class="form-body">

      <!-- Message box -->
      <div class="msg" id="msgBox"></div>

      <!-- LOGIN FORM -->
      <div id="loginForm">
        <div class="field">
          <label>Email Address</label>
          <input type="email" id="loginEmail" placeholder="operator@domain.com" autocomplete="email"/>
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••••••" autocomplete="current-password"/>
        </div>
        <button class="btn-primary" id="loginBtn" onclick="handleLogin()">
          <span id="loginBtnText">↳ Initiate Session</span>
        </button>
      </div>

      <!-- SIGNUP FORM -->
      <div id="signupForm" style="display:none;">

        <!-- Avatar upload -->
        <div class="avatar-row">
          <div class="avatar-preview" id="avatarPreview" title="Upload profile photo">
            <div class="avatar-placeholder" id="avatarPlaceholder">◎</div>
            <img id="avatarImg" src="" alt="" style="display:none;"/>
            <input type="file" id="avatarFile" accept="image/jpeg,image/png,image/webp" onchange="previewAvatar(event)"/>
          </div>
          <div class="avatar-hint">
            <strong>Profile Photo</strong>
            Click to upload · JPG, PNG, WEBP · Max 5MB
          </div>
        </div>

        <div class="field">
          <label>Full Name</label>
          <input type="text" id="signupName" placeholder="e.g. Archishman Das" autocomplete="name"/>
        </div>
        <div class="field">
          <label>Email Address</label>
          <input type="email" id="signupEmail" placeholder="you@domain.com" autocomplete="email"/>
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="signupPassword" placeholder="min 8 characters" autocomplete="new-password"/>
        </div>
        <button class="btn-primary" id="signupBtn" onclick="handleSignup()">
          <span id="signupBtnText">↳ Deploy Identity</span>
        </button>
      </div>

    </div>
  </div>

<script>
  const SUPABASE_URL = 'https://ioqgduqyfdcjvafyytxz.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_3zzV6ji9zBp8xWtV_3jfGw_y2AA1Ey7';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Check if already logged in
  (async () => {
    const { data: { session } } = await sb.auth.getSession();
    if (session) window.location.replace('index.html');
  })();

  // --- Tab switching ---
  function switchTab(tab) {
    hideMsg();
    if (tab === 'login') {
      document.getElementById('loginForm').style.display = 'block';
      document.getElementById('signupForm').style.display = 'none';
      document.getElementById('tabLogin').classList.add('active');
      document.getElementById('tabSignup').classList.remove('active');
    } else {
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('signupForm').style.display = 'block';
      document.getElementById('tabLogin').classList.remove('active');
      document.getElementById('tabSignup').classList.add('active');
    }
  }

  // --- Message helpers ---
  function showMsg(text, type = 'error') {
    const el = document.getElementById('msgBox');
    el.textContent = text;
    el.className = `msg ${type} show`;
  }
  function hideMsg() {
    document.getElementById('msgBox').className = 'msg';
  }

  function setLoading(btnId, textId, loading, label) {
    const btn = document.getElementById(btnId);
    const span = document.getElementById(textId);
    btn.disabled = loading;
    span.innerHTML = loading
      ? `<span class="spinner"></span> Processing...`
      : label;
  }

  // --- Avatar preview ---
  let avatarFileObj = null;
  function previewAvatar(e) {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) {
      showMsg('Image must be under 5MB.'); return;
    }
    avatarFileObj = file;
    const reader = new FileReader();
    reader.onload = (ev) => {
      document.getElementById('avatarImg').src = ev.target.result;
      document.getElementById('avatarImg').style.display = 'block';
      document.getElementById('avatarPlaceholder').style.display = 'none';
    };
    reader.readAsDataURL(file);
  }

  // --- LOGIN ---
  async function handleLogin() {
    hideMsg();
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    if (!email || !password) { showMsg('Email and password required.'); return; }

    setLoading('loginBtn', 'loginBtnText', true);
    const { error } = await sb.auth.signInWithPassword({ email, password });
    setLoading('loginBtn', 'loginBtnText', false, '↳ Initiate Session');

    if (error) { showMsg(error.message); return; }
    window.location.replace('index.html');
  }

  // Allow Enter key
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    const loginVisible = document.getElementById('loginForm').style.display !== 'none';
    if (loginVisible) handleLogin();
    else handleSignup();
  });

  // --- SIGNUP ---
  async function handleSignup() {
    hideMsg();
    const name = document.getElementById('signupName').value.trim();
    const email = document.getElementById('signupEmail').value.trim();
    const password = document.getElementById('signupPassword').value;

    if (!name) { showMsg('Full name is required.'); return; }
    if (!email) { showMsg('Email address is required.'); return; }
    if (password.length < 8) { showMsg('Password must be at least 8 characters.'); return; }

    setLoading('signupBtn', 'signupBtnText', true);

    // 1. Sign up with metadata
    const { data: signupData, error: signupError } = await sb.auth.signUp({
      email,
      password,
      options: { data: { full_name: name } }
    });

    if (signupError) {
      setLoading('signupBtn', 'signupBtnText', false, '↳ Deploy Identity');
      showMsg(signupError.message);
      return;
    }

    const userId = signupData.user?.id;

    // 2. Upload avatar if provided
    let avatarUrl = null;
    if (avatarFileObj && userId) {
      const ext = avatarFileObj.name.split('.').pop();
      const path = `${userId}/avatar.${ext}`;
      const { error: uploadError } = await sb.storage
        .from('avatars')
        .upload(path, avatarFileObj, { upsert: true });

      if (!uploadError) {
        const { data: urlData } = sb.storage.from('avatars').getPublicUrl(path);
        avatarUrl = urlData.publicUrl;
      }
    }

    // 3. Update profile with name + avatar URL
    if (userId) {
      await sb.from('profiles').upsert({
        id: userId,
        full_name: name,
        avatar_url: avatarUrl,
        updated_at: new Date().toISOString()
      });
    }

    setLoading('signupBtn', 'signupBtnText', false, '↳ Deploy Identity');
    showMsg('Identity deployed. Check your email to verify, then log in.', 'success');
  }
</script>
</body>
</html>
