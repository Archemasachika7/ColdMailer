<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Auth - The Architect</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700;900&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <style>
        body { font-family: 'Manrope', sans-serif; }
        h1, h2, h3, h4, h5, h6, .font-headline { font-family: 'Space Grotesk', sans-serif; }
    </style>
</head>
<body class="min-h-screen bg-[#10131a] text-[#e1e2eb] flex items-center justify-center p-6">
    <div class="w-full max-w-md rounded-xl bg-[#191c22]/70 border border-[#3a494b]/30 p-8 shadow-2xl">
        <h1 class="font-headline text-2xl font-black mb-2">The Architect</h1>
        <p class="text-[#b9cacb] text-sm mb-6">Sign up or log in to access your dispatch dashboard.</p>

        <div id="errorMsg" class="hidden mb-4 text-sm text-[#ffb4ab]"></div>

        <form id="authForm" class="space-y-4">
            <div>
                <label class="text-[11px] font-bold uppercase tracking-wider text-[#b9cacb] block mb-1">Email</label>
                <input id="email" type="email" required class="w-full bg-[#10131a] border border-[#3a494b]/40 rounded p-3 text-white text-sm focus:border-[#00f2ff] focus:outline-none">
            </div>
            <div>
                <label class="text-[11px] font-bold uppercase tracking-wider text-[#b9cacb] block mb-1">Password</label>
                <input id="password" type="password" required class="w-full bg-[#10131a] border border-[#3a494b]/40 rounded p-3 text-white text-sm focus:border-[#00f2ff] focus:outline-none">
            </div>
            <div class="grid grid-cols-2 gap-3 pt-2">
                <button type="button" id="signupBtn" class="rounded bg-[#00f2ff] text-[#006a71] py-2 font-bold">Sign Up</button>
                <button type="button" id="loginBtn" class="rounded border border-[#3a494b] text-[#e1e2eb] py-2 font-bold">Log In</button>
            </div>
        </form>
    </div>

<script>
    const SUPABASE_URL = 'https://ioqgduqyfdcjvafyytxz.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_3zzV6ji9zBp8xWtV_3jfGw_y2AA1Ey7';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function showError(message) {
        const errEl = document.getElementById('errorMsg');
        errEl.textContent = message;
        errEl.classList.remove('hidden');
    }

    function clearError() {
        const errEl = document.getElementById('errorMsg');
        errEl.textContent = '';
        errEl.classList.add('hidden');
    }

    async function checkSession() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session) {
            window.location.replace('index.html');
        }
    }

    async function handleSignup() {
        clearError();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const { error } = await supabaseClient.auth.signUp({ email, password });
        if (error) {
            showError(error.message);
            return;
        }
        alert("Signup successful. Check your email for verification if required, then log in.");
    }

    async function handleLogin() {
        clearError();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) {
            showError(error.message);
            return;
        }
        window.location.replace('index.html');
    }

    document.getElementById('signupBtn').addEventListener('click', handleSignup);
    document.getElementById('loginBtn').addEventListener('click', handleLogin);
    checkSession();
</script>
</body>
</html>
